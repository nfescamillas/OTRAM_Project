name: Promote dev image to production

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Immutable CI image tag to promote (sha- followed by the full 40-character commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote image and deploy Render
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: render-production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Validate promotion request
        shell: bash
        env:
          REQUESTED_SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if [[ ! "$REQUESTED_SOURCE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "source_tag must match sha-<full-40-character-lowercase-commit-sha>." >&2
            exit 1
          fi
          echo "SOURCE_TAG=$REQUESTED_SOURCE_TAG" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=${REQUESTED_SOURCE_TAG#sha-}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Validate Render deployment configuration
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured in the render-production environment." >&2
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://api.render.com/deploy/* ]]; then
            echo "RENDER_DEPLOY_HOOK_URL must be a Render deploy hook URL." >&2
            exit 1
          fi
          if [[ "$RENDER_SERVICE_URL" != https://* ]]; then
            echo "RENDER_SERVICE_URL must be the Render service's public HTTPS URL." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote existing image manifest
        id: promote
        shell: bash
        run: |
          source_ref="$IMAGE_NAME:$SOURCE_TAG"
          production_ref="$IMAGE_NAME:production"

          source_digest="sha256:$(docker buildx imagetools inspect "$source_ref" --raw | sha256sum | awk '{print $1}')"
          docker buildx imagetools create --tag "$production_ref" "$source_ref"
          production_digest="sha256:$(docker buildx imagetools inspect "$production_ref" --raw | sha256sum | awk '{print $1}')"

          if [[ "$source_digest" != "$production_digest" ]]; then
            echo "Promoted manifest digest does not match the selected source image." >&2
            exit 1
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "production_ref=$production_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deployment of promoted revision
        id: deploy
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          response_file="$(mktemp)"
          status_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --get \
            --data-urlencode "ref=$SOURCE_SHA" \
            "$RENDER_DEPLOY_HOOK_URL")"

          if [[ "$status_code" != "200" && "$status_code" != "202" ]]; then
            echo "Render rejected the deployment request with HTTP $status_code." >&2
            cat "$response_file" >&2
            exit 1
          fi

          deploy_id="$(jq -r '.deploy.id // empty' "$response_file")"
          echo "status_code=$status_code" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Verify promoted revision on Render
        id: health
        shell: bash
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          health_url="${RENDER_SERVICE_URL%/}/healthz"
          response_file="$(mktemp)"

          for attempt in $(seq 1 120); do
            status_code="$(curl --silent --show-error \
              --max-time 10 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$health_url" || true)"

            if [[ "$status_code" == "200" ]] && jq --exit-status \
              --arg expected_revision "$SOURCE_SHA" \
              '.status == "ok" and .revision == $expected_revision' \
              "$response_file" > /dev/null 2>&1; then
              echo "Render is healthy and serving revision $SOURCE_SHA."
              echo "health_url=$health_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt/120: waiting for Render to serve revision $SOURCE_SHA (HTTP $status_code)."
            if [[ "$attempt" -lt 120 ]]; then
              sleep 10
            fi
          done

          echo "Render did not become healthy on revision $SOURCE_SHA within 20 minutes." >&2
          echo "Last health response:" >&2
          cat "$response_file" >&2
          exit 1

      - name: Record promotion summary
        shell: bash
        env:
          SOURCE_REF: ${{ steps.promote.outputs.source_ref }}
          PRODUCTION_REF: ${{ steps.promote.outputs.production_ref }}
          PROMOTED_DIGEST: ${{ steps.promote.outputs.digest }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          RENDER_STATUS_CODE: ${{ steps.deploy.outputs.status_code }}
          HEALTH_URL: ${{ steps.health.outputs.health_url }}
        run: |
          {
            echo "## Production promotion verified"
            echo
            echo "- Source: \`$SOURCE_REF\`"
            echo "- Production tag: \`$PRODUCTION_REF\`"
            echo "- Manifest digest: \`$PROMOTED_DIGEST\`"
            echo "- Render response: HTTP $RENDER_STATUS_CODE"
            if [[ -n "$DEPLOY_ID" ]]; then
              echo "- Render deploy ID: \`$DEPLOY_ID\`"
            else
              echo "- Render deploy status: queued behind an in-progress deployment"
            fi
            echo "- Health endpoint: $HEALTH_URL"
            echo "- Verified revision: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"


[project]
name = "otarm-on-call-engineer"
version = "0.1.0"
description = "Poll Prometheus alerts and dispatch bounded Codex triage runs"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
otarm-on-call = "on_call_engineer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/on_call_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

openapi: 3.1.0
info:
  title: OTARM Frontend Backend API
  version: 1.0.0
  description: |
    The complete HTTP API currently expected by the frontend service contract in
    `frontend/src/services/otarmService.ts`.

    Every business-data operation requires an expiring bearer token. The token
    endpoint is the only unauthenticated operation.

    All records must be scoped to the organization selected from the trusted
    session. IDs and organization scope must never be trusted solely because they
    were supplied by the client. Stored OT device addresses are inventory data
    only and must never be used for discovery, polling, probing, or configuration.
servers:
  - url: /api/v1
    description: Same-origin backend mounted below the frontend origin.
tags:
  - name: Authentication
  - name: Dashboard
  - name: Sites
  - name: Assets
  - name: Findings
  - name: Remediation
  - name: Audit

paths:
  /auth/token:
    post:
      tags: [Authentication]
      summary: Exchange credentials for a bearer token
      operationId: createToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed, expiring bearer token and current user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sites:
    get:
      tags: [Sites]
      summary: List sites
      description: Returns every site visible to the authenticated user's active organization membership.
      operationId: getSites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sites in the active organization.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
              examples:
                sites:
                  value:
                    - id: site-north
                      code: NPR
                      name: North Process Plant
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary
      description: Returns current organization metrics, optionally restricted to one organization-owned site.
      operationId: getDashboardSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
      responses:
        '200':
          description: Current dashboard metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets:
    get:
      tags: [Assets]
      summary: List assets
      description: Returns the complete filtered asset array expected by `OtarmService.listAssets`.
      operationId: listAssets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchFilter'
        - $ref: '#/components/parameters/SiteIdFilter'
        - $ref: '#/components/parameters/AssetTypeFilter'
        - $ref: '#/components/parameters/LifecycleFilter'
      responses:
        '200':
          description: Assets matching all supplied filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Assets]
      summary: Register an asset
      description: Creates one asset in the active organization and records an audit event.
      operationId: createAsset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAssetInput'
            examples:
              plc:
                value:
                  tag: NPR-PLC-015
                  name: Condensate Transfer PLC
                  type: PLC
                  siteId: site-north
                  area: Utilities
                  vendor: Rockwell Automation
                  model: ControlLogix 5580
                  criticality: HIGH
                  lifecycle: UNKNOWN
                  verification: UNVERIFIED
                  operationalStatus: ACTIVE
                  owner: Maya Chen
                  firmware: v35.011
                  networkZone: Cell 2 - Utilities
                  ipAddress: 10.42.20.15
      responses:
        '201':
          description: Asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /assets/{assetId}:
    get:
      tags: [Assets]
      summary: Get an asset
      description: Returns one asset only when it belongs to the active organization.
      operationId: getAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Asset details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /assets/export.csv:
    get:
      tags: [Assets]
      summary: Export filtered assets
      description: |
        Returns the same filtered population as `listAssets` as UTF-8 CSV.
        Cells beginning with `=`, `+`, `-`, or `@` must be neutralized so the
        result cannot execute spreadsheet formulas.
      operationId: exportAssetsCsv
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchFilter'
        - $ref: '#/components/parameters/SiteIdFilter'
        - $ref: '#/components/parameters/AssetTypeFilter'
        - $ref: '#/components/parameters/LifecycleFilter'
      responses:
        '200':
          description: Spreadsheet-safe CSV export.
          headers:
            Content-Disposition:
              description: Suggested download filename.
              schema:
                type: string
                example: attachment; filename="otarm-assets.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                Asset tag,Name,Type,Site,Criticality,Lifecycle,Owner
                NPR-PLC-014,Boiler Feedwater PLC,PLC,North Process Plant,SAFETY_CRITICAL,SUPPORTED,Maya Chen
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /findings:
    get:
      tags: [Findings]
      summary: List risk findings
      description: Returns findings matching the optional site, status, and severity filters.
      operationId: listFindings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
        - name: status
          in: query
          required: false
          description: Exact finding workflow status.
          schema:
            $ref: '#/components/schemas/FindingStatus'
        - name: severity
          in: query
          required: false
          description: Exact current risk severity.
          schema:
            $ref: '#/components/schemas/Severity'
      responses:
        '200':
          description: Findings matching all supplied filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Finding'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /remediation:
    get:
      tags: [Remediation]
      summary: List remediation actions
      description: Returns the remediation work register for the active organization.
      operationId: listRemediation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Remediation actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RemediationAction'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /actions/{actionId}/status:
    patch:
      tags: [Remediation]
      summary: Update an action status
      description: |
        Applies an authorized remediation workflow transition and creates an
        audit event. The backend must enforce role and separation-of-duties rules;
        it must not trust the frontend to hide prohibited transitions.
      operationId: updateActionStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActionStatusInput'
            examples:
              submitForVerification:
                value:
                  status: PENDING_VERIFICATION
      responses:
        '200':
          description: Updated remediation action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationAction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /audit-events:
    get:
      tags: [Audit]
      summary: List audit events
      description: Returns audit events visible to the authenticated admin or approver.
      operationId: getAuditEvents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OTARM-HMAC
      description: HMAC-signed bearer token returned by POST /auth/token.

  parameters:
    SearchFilter:
      name: search
      in: query
      required: false
      description: Case-insensitive match against asset tag, name, vendor, or model.
      schema:
        type: string
        maxLength: 160
    SiteIdFilter:
      name: siteId
      in: query
      required: false
      description: Restricts results to one site in the active organization.
      schema:
        $ref: '#/components/schemas/Identifier'
    AssetTypeFilter:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetType'
    LifecycleFilter:
      name: lifecycle
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LifecycleState'
    AssetId:
      name: assetId
      in: path
      required: true
      description: Asset identifier.
      schema:
        $ref: '#/components/schemas/Identifier'
    ActionId:
      name: actionId
      in: path
      required: true
      description: Remediation action identifier.
      schema:
        $ref: '#/components/schemas/Identifier'

  responses:
    Unauthorized:
      description: Authentication is required or the session is no longer valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            missingSession:
              value:
                code: UNAUTHENTICATED
                message: Authentication is required.
                requestId: req-01JBA6JFM12N4C0A2XH4QMZB60
    Forbidden:
      description: The active membership or role does not authorize this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            insufficientRole:
              value:
                code: FORBIDDEN
                message: You are not authorized to perform this operation.
                requestId: req-01JBA6JFM12N4C0A2XH4QMZB60
    NotFound:
      description: The record does not exist or is outside the active organization scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            missingRecord:
              value:
                code: NOT_FOUND
                message: The requested record was not found.
                requestId: req-01JBA6JFM12N4C0A2XH4QMZB60
    ValidationError:
      description: One or more request values are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            invalidAsset:
              value:
                code: VALIDATION
                message: Asset tag and name are required.
                requestId: req-01JBA6JFM12N4C0A2XH4QMZB60
                fields:
                  tag: Asset tag is required.
    Conflict:
      description: The request conflicts with uniqueness rules or the current workflow state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            duplicateTag:
              value:
                code: CONFLICT
                message: Asset tag already exists.
                requestId: req-01JBA6JFM12N4C0A2XH4QMZB60

  schemas:
    Role:
      type: string
      enum: [ADMIN, ASSESSOR, APPROVER, VIEWER]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Lifetime of the token in seconds.
        user:
          $ref: '#/components/schemas/PublicUser'

    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque identifier. Clients must not derive meaning from its format.
      examples: [a1]

    AssetType:
      type: string
      enum:
        - PLC
        - DCS_SERVER
        - SCADA_SERVER
        - ENGINEERING_WORKSTATION
        - HMI
        - NETWORK_SWITCH
        - FIREWALL
        - ROUTER
        - HISTORIAN
        - GATEWAY
        - OTHER

    Criticality:
      type: string
      enum: [LOW, MEDIUM, HIGH, SAFETY_CRITICAL]

    LifecycleState:
      type: string
      enum: [UNKNOWN, SUPPORTED, LIMITED_SUPPORT, END_OF_SUPPORT, END_OF_LIFE]

    VerificationState:
      type: string
      enum: [VERIFIED, UNVERIFIED, STALE]

    OperationalStatus:
      type: string
      enum: [ACTIVE, STANDBY, OUT_OF_SERVICE, RETIRED]

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    FindingStatus:
      type: string
      enum: [OPEN, TREATMENT_IN_PROGRESS, MITIGATED, ACCEPTED]

    ActionStatus:
      type: string
      enum: [OPEN, PLANNED, IN_PROGRESS, PENDING_VERIFICATION, VERIFIED, CANCELLED]

    AuditResult:
      type: string
      enum: [SUCCESS, DENIED]

    Site:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 160

    NewAssetInput:
      type: object
      required:
        - tag
        - name
        - type
        - siteId
        - area
        - vendor
        - model
        - criticality
        - lifecycle
        - verification
        - operationalStatus
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 160
        type:
          $ref: '#/components/schemas/AssetType'
        siteId:
          $ref: '#/components/schemas/Identifier'
        area:
          type: string
          maxLength: 160
        vendor:
          type: string
          maxLength: 160
        model:
          type: string
          maxLength: 160
        criticality:
          $ref: '#/components/schemas/Criticality'
        lifecycle:
          $ref: '#/components/schemas/LifecycleState'
        verification:
          $ref: '#/components/schemas/VerificationState'
        lastVerifiedAt:
          type: string
          format: date
        operationalStatus:
          $ref: '#/components/schemas/OperationalStatus'
        owner:
          type: string
          maxLength: 160
        firmware:
          type: string
          maxLength: 255
          description: Human-provided vendor version string; never compare as a decimal.
        networkZone:
          type: string
          maxLength: 160
        ipAddress:
          type: string
          maxLength: 45
          description: Display-only inventory value. The backend must never connect to it.
        assessed:
          type: boolean
          default: false
          description: Optional in the frontend input type; a production backend should normally derive this value.

    Asset:
      allOf:
        - $ref: '#/components/schemas/NewAssetInput'
        - type: object
          required: [id, assessed]
          properties:
            id:
              $ref: '#/components/schemas/Identifier'
            assessed:
              type: boolean

    Finding:
      type: object
      additionalProperties: false
      required:
        - id
        - assetId
        - title
        - riskScenario
        - controlGap
        - recommendedTreatment
        - status
        - impact
        - likelihood
        - severity
        - score
        - raisedAt
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        assetId:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 255
        riskScenario:
          type: string
        controlGap:
          type: string
        recommendedTreatment:
          type: string
        status:
          $ref: '#/components/schemas/FindingStatus'
        impact:
          type: integer
          minimum: 1
          maximum: 5
        likelihood:
          type: integer
          minimum: 1
          maximum: 5
        severity:
          $ref: '#/components/schemas/Severity'
        score:
          type: integer
          minimum: 1
          maximum: 25
          readOnly: true
          description: Calculated by the backend as impact multiplied by likelihood.
        raisedAt:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        owner:
          type: string
          maxLength: 160

    RemediationAction:
      type: object
      additionalProperties: false
      required: [id, findingId, title, assignedTo, dueDate, status]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        findingId:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 255
        assignedTo:
          type: string
          minLength: 1
          maxLength: 160
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ActionStatus'
        completionNotes:
          type: string

    UpdateActionStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ActionStatus'

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor, action, entity, occurredAt, result]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        actor:
          type: string
          minLength: 1
          maxLength: 160
        action:
          type: string
          minLength: 1
          maxLength: 100
        entity:
          type: string
          minLength: 1
          maxLength: 255
        occurredAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/AuditResult'

    SeverityCounts:
      type: object
      additionalProperties: false
      required: [LOW, MEDIUM, HIGH, CRITICAL]
      properties:
        LOW:
          type: integer
          minimum: 0
        MEDIUM:
          type: integer
          minimum: 0
        HIGH:
          type: integer
          minimum: 0
        CRITICAL:
          type: integer
          minimum: 0

    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        - activeAssets
        - assessedAssets
        - coveragePercent
        - severityCounts
        - lifecycleUnresolved
        - overdueActions
        - acceptedRisks
        - unscoredFindings
        - topPriorities
      properties:
        activeAssets:
          type: integer
          minimum: 0
        assessedAssets:
          type: integer
          minimum: 0
        coveragePercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Null when there are no active assets; never report 0/0 as 100 percent.
        severityCounts:
          $ref: '#/components/schemas/SeverityCounts'
        lifecycleUnresolved:
          type: integer
          minimum: 0
        overdueActions:
          type: integer
          minimum: 0
        acceptedRisks:
          type: integer
          minimum: 0
        unscoredFindings:
          type: integer
          minimum: 0
        topPriorities:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Finding'

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION, CONFLICT, INTERNAL]
        message:
          type: string
        requestId:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

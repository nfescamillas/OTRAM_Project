services:
  - type: web
    name: otarm
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: OTARM_DATABASE_URL
        fromDatabase:
          name: otarm-db
          property: connectionString
      - key: OTARM_DEMO_PASSWORD
        sync: false
      - key: OTARM_TOKEN_SECRET
        generateValue: true
      - key: OTARM_TOKEN_TTL_SECONDS
        value: "3600"

databases:
  - name: otarm-db
    plan: free
    region: singapore
    databaseName: otarm
    user: otarm
    ipAllowList: []

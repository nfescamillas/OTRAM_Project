services:
  - type: web
    name: otarm
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # GitHub Actions triggers the exact tested commit through Render's deploy hook.
    autoDeployTrigger: "off"
    envVars:
      - key: OTARM_DATABASE_URL
        fromDatabase:
          name: otarm-db
          property: connectionString
      - key: OTARM_DEMO_PASSWORD
        sync: false
      - key: OTARM_TOKEN_SECRET
        generateValue: true
      - key: OTARM_TOKEN_TTL_SECONDS
        value: "3600"
      - key: OTARM_ENVIRONMENT
        value: production
      - key: OTEL_SERVICE_NAME
        value: otarm-backend
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

databases:
  - name: otarm-db
    plan: free
    region: singapore
    databaseName: otarm
    user: otarm
    ipAllowList: []
